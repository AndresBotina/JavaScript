<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de estudiantes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Space+Grotesk:wght@400;500&display=swap">
    <link rel="stylesheet" href="css/ejercicio4.css">
</head>
<body>
    <!-- Decoración espacial: no afecta el ejercicio -->
    <div class="estrellas" aria-hidden="true"></div>
    <div class="planeta-anillos" aria-hidden="true"></div>
    <div class="luna" aria-hidden="true"></div>
    <div class="ovni" aria-hidden="true">
        <div class="alien"></div>
        <div class="rayo"></div>
    </div>

    <main class="nave">
        <a href="index.html" class="volver">← Volver al menú</a>

        <h1>Buscador de estudiantes</h1>

        <h2>Estudiantes registrados</h2>
        <ul id="lista"></ul>

        <form id="formulario">
            <label for="buscar">Nombre del estudiante:</label>
            <input type="text" id="buscar" placeholder="Ingrese un nombre">
            <button type="submit" id="btnBuscar">Buscar</button>
        </form>

        <h2>Resultado</h2>
        <p id="resultado"></p>
    </main>

    <script src="js/ejercicio4.js"></script>
</body>
</html>
