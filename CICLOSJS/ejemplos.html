<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejemplos de ciclos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body data-ejercicio="ejemplos">
  <header>
    <div id="escena3d" data-animal="Pajaro" aria-hidden="true"></div>
    <a href="index.html">← Volver al menú</a>
    <h1><span>Ejemplos guiados</span> Ejemplos de ciclos</h1>
    <p id="etiquetas">for · while · do...while</p>
  </header>

  <main>
  <form id="formTabla">
    <label for="numeroTabla">Número para la tabla:</label>
    <input type="number" id="numeroTabla" step="1" required>
    <button type="submit">Generar tabla</button>
  </form>
  <ul id="listaTabla"></ul>

  <form id="formAhorro">
    <label for="ahorroMensual">Ahorro mensual:</label>
    <input type="number" id="ahorroMensual" step="any" required>
    <label for="meta">Meta de ahorro:</label>
    <input type="number" id="meta" step="any" required> 
    <button type="submit">Calcular meses</button>
  </form>
  <p id="resultadoAhorro"></p>

  <form id="formDado">
    <label for="objetivo">Numero del dado que buscas (1 a 6):</label>
    <input type="number" id="objetivo" min="1" max="6" required>
    <button type="submit">Lanzar dado</button>
  </form>
  <p id="resultadoDado"></p>
  <ul id="listaDado"></ul>
  </main>

  <nav class="pasos" aria-label="Otros ejercicios">
    <a href="index.html"><span>← Anterior</span>Menú</a>
    <a href="ejercicio1.html"><span>Ejercicio 1 →</span>Sistema de compras en una tienda</a>
  </nav>

  <script src="js/ejemplo-for.js"></script>
  <script src="js/ejemplo-while.js"></script>
  <script src="js/ejemplo-do-while.js"></script>
  <script src="js/vendor/three.min.js"></script>
  <script src="js/animales/base.js"></script>
  <script src="js/animales/pajaro.js"></script>
  <script src="js/escena3d.js"></script>
</body>
</html>
